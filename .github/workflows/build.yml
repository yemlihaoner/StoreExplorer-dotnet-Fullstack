name: Build and Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build Backend API & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore StoreExplorer.Tests/StoreExplorer.Tests.csproj

      - name: Run Tests
        run: dotnet test StoreExplorer.Tests/StoreExplorer.Tests.csproj --configuration Release --no-restore

  build-client:
    name: Build MAUI Client
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore StoreExplorer.csproj

      # Verify client build using the Windows desktop target as baseline
      - name: Build Client (Windows)
        run: dotnet build StoreExplorer.csproj -f net10.0-windows10.0.19041.0 --configuration Release --no-restore
